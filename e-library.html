<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>E-Library — Bishop Angelo Tarantino Memorial SS</title>
<style>
  :root { --brand: #14532d; --brand-2: #166534; --bg: #f8fafc; --line: #e2e8f0; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
         background: var(--bg); color: #0f172a; padding: 2rem 1rem; }
  .wrap { max-width: 900px; margin: 0 auto; }
  .head { display: flex; justify-content: space-between; align-items: flex-start;
          flex-wrap: wrap; gap: 1rem; margin-bottom: 1.5rem; }
  h1 { color: var(--brand); margin: 0 0 .25rem; }
  .sub { color: #64748b; margin: 0; font-size: .95rem; }

  .controls { display: flex; gap: .75rem; flex-wrap: wrap; margin-bottom: 1.25rem; }
  .controls input, .controls select {
    padding: .65rem .75rem; border: 1px solid var(--line); border-radius: 8px;
    font: inherit; background: #fff; min-width: 160px;
  }
  .controls input[type="search"] { flex: 1; min-width: 220px; }
  .controls input:focus, .controls select:focus {
    outline: 2px solid var(--brand-2); border-color: var(--brand-2);
  }
  .result-count { font-size: .85rem; color: #64748b; margin-bottom: 1rem; }

  .book {
    background: #fff; border: 1px solid var(--line); border-radius: 12px;
    padding: 1rem 1.1rem; margin-bottom: .9rem;
    display: flex; justify-content: space-between; align-items: center; gap: 1rem;
  }
  .book-info h3 { margin: 0 0 .25rem; font-size: 1.05rem; }
  .book-info p { margin: 0; font-size: .85rem; color: #64748b; }
  .meta { display: flex; gap: .5rem; flex-wrap: wrap; margin-top: .35rem; }
  .tag { font-size: .72rem; padding: .15rem .55rem; border-radius: 999px;
         background: #ecfdf5; color: var(--brand); font-weight: 600; }
  .tag.level { background: #eff6ff; color: #1e40af; }
  .downloads { font-size: .75rem; color: #64748b; margin-top: .35rem; }

  .download-btn {
    background: var(--brand); color: #fff; text-decoration: none;
    padding: .55rem 1rem; border-radius: 8px; font-weight: 600;
    font-size: .85rem; white-space: nowrap; border: 0; cursor: pointer;
    display: inline-block; text-align: center;
  }
  .download-btn:hover { background: var(--brand-2); }
  .download-btn:disabled { opacity: .6; cursor: wait; }

  .empty { text-align: center; padding: 3rem 1rem; color: #64748b; }

  @media (max-width: 600px) {
    .book { flex-direction: column; align-items: flex-start; }
    .download-btn { width: 100%; }
  }
</style>
</head>
<body>
<div class="wrap">

  <div class="head">
    <div>
      <h1>E-Library</h1>
      <p class="sub">Browse and download past papers, textbooks, and study resources.</p>
    </div>
  </div>

  <div class="controls">
    <input id="search" type="search" placeholder="Search by title or author…">
    <select id="filter-subject"><option value="">All subjects</option></select>
    <select id="filter-level">
      <option value="">All levels</option>
      <option value="O-Level">O-Level</option>
      <option value="A-Level">A-Level</option>
      <option value="General">General</option>
    </select>
  </div>

  <div class="result-count" id="count">Loading…</div>
  <div id="list"></div>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
  getFirestore, collection, query, orderBy, onSnapshot,
  doc, getDoc, updateDoc, increment
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

// ───── YOUR CONFIG ─────
const firebaseConfig = {
  apiKey: "AIzaSyAUExS9Nka5TfNXjRfjXtc2jwDPaixmfrU",
  authDomain: "e-library-dd680.firebaseapp.com",
  projectId: "e-library-dd680",
  storageBucket: "e-library-dd680.firebasestorage.app",
  messagingSenderId: "960704565735",
  appId: "1:960704565735:web:a1856b2c3e583da559ad42"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

let allBooks = [];
let ready = false;

const $list = document.getElementById("list");
const $count = document.getElementById("count");
const $search = document.getElementById("search");
const $subject = document.getElementById("filter-subject");
const $level = document.getElementById("filter-level");

// ───── Load Books ─────
const qAll = query(collection(db, "library"), orderBy("created_at", "desc"));
onSnapshot(qAll, (snap) => {
  allBooks = snap.docs.map(d => ({ id: d.id, ...d.data() }));
  ready = true;
  
  const subjects = [...new Set(allBooks.map(b => b.subject).filter(Boolean))].sort();
  if ($subject.options.length <= 1) {
    subjects.forEach(s => {
      const o = document.createElement("option"); o.value = s; o.textContent = s; $subject.appendChild(o);
    });
  }
  render();
});

// ───── Filters ─────
[$search, $subject, $level].forEach(el => { 
  el.addEventListener("input", render); 
  el.addEventListener("change", render); 
});

function render() {
  if (!ready) return;
  const term = $search.value.trim().toLowerCase();
  const subject = $subject.value;
  const level = $level.value;

  const filtered = allBooks.filter(b => {
    if (subject && b.subject !== subject) return false;
    if (level && b.level !== level) return false;
    if (term) {
      const hay = `${b.title || ""} ${b.author || ""} ${b.subject || ""}`.toLowerCase();
      if (!hay.includes(term)) return false;
    }
    return true;
  });

  $count.textContent = filtered.length === 0 ? "No matching resources." : `${filtered.length} resource(s) found`;
  
  if (filtered.length === 0) {
    $list.innerHTML = `<div class="empty">Nothing matches your search.</div>`;
    return;
  }

  $list.innerHTML = filtered.map(b => {
    return `
      <div class="book" data-id="${b.id}">
        <div class="book-info">
          <h3>${esc(b.title)}</h3>
          <p>${esc(b.author || "Unknown author")}</p>
          <div class="meta">
            ${b.subject ? `<span class="tag">${esc(b.subject)}</span>` : ""}
            ${b.level ? `<span class="tag level">${esc(b.level)}</span>` : ""}
          </div>
          <div class="downloads">⬇️ ${b.downloads || 0} downloads</div>
        </div>
        <button class="download-btn" data-id="${b.id}">Download</button>
      </div>
    `;
  }).join("");

  $list.querySelectorAll(".download-btn[data-id]").forEach(btn => {
    btn.addEventListener("click", () => handleDownload(btn.dataset.id, btn));
  });
}

// ───── Download Logic (Mobile Friendly) ─────
async function handleDownload(bookId, btn) {
  const originalText = btn.textContent;
  btn.textContent = "Preparing...";
  btn.disabled = true;

  try {
    const docRef = doc(db, "library", bookId);
    const docSnap = await getDoc(docRef);
    if (!docSnap.exists()) throw new Error("Book not found");

    const book = docSnap.data();
    let downloadUrl = "";

    // 1. Get the file data
    if (book.base64File) {
      // Convert Base64 to a real file (Blob) so phones don't rename it
      const base64Data = book.base64File.split(',')[1];
      const byteCharacters = atob(base64Data);
      const byteNumbers = new Array(byteCharacters.length);
      for (let i = 0; i < byteCharacters.length; i++) {
        byteNumbers[i] = byteCharacters.charCodeAt(i);
      }
      const byteArray = new Uint8Array(byteNumbers);
      const blob = new Blob([byteArray], { type: 'application/pdf' });
      
      downloadUrl = URL.createObjectURL(blob);
    } else if (book.fileUrl) {
      downloadUrl = book.fileUrl;
    } else {
      throw new Error("No file data found for this book.");
    }

    // 2. Set a clean file name based on the Title
    // This replaces spaces with underscores and adds .pdf
    const safeTitle = (book.title || "document").replace(/[^a-z0-9]/gi, '_');
    const fileName = `${safeTitle}.pdf`;

    // 3. Trigger the download
    const a = document.createElement("a");
    a.href = downloadUrl;
    a.download = fileName; 
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);

    // 4. Clean up memory
    if (book.base64File) {
      setTimeout(() => URL.revokeObjectURL(downloadUrl), 1000);
    }

    // 5. Increment counter
    await updateDoc(docRef, { downloads: increment(1) });

  } catch (err) {
    console.error("Download failed:", err);
    alert("Failed to download: " + err.message);
  } finally {
    btn.textContent = originalText;
    btn.disabled = false;
  }
}

// ───── Utility ─────
function esc(s) {
  return String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
}
</script>

<!-- site-wide banner -->
<script type="module" src="/tarantino/announcement.js"></script>
</body>
</html>
